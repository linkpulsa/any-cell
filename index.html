    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f0f2f5; color: #333; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; }
        
        header { 
            background: #ee4d2d; 
            color: white; 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 10px rgba(238,77,45,0.3); 
        }
        header h1 { font-size: 26px; margin-bottom: 5px; font-weight: bold; }
        header p { font-size: 14px; opacity: 0.9; }

        /* Grid Responsif Otomatis untuk HP & Tablet */
        .container { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 20px; 
            max-width: 1100px; 
            margin: 0 auto; 
            width: 100%;
            flex: 1;
        }

        /* Penyesuaian kolom grid berdasarkan ukuran layar */
        @media (max-width: 1024px) {
            .container { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 600px) {
            .container { grid-template-columns: repeat(2, 1fr); gap: 12px; }
        }

        /* Gaya Kartu Mengambang Berbingkai */
        .card { 
            background: #ffffff; 
            padding: 20px 10px 15px 10px; 
            border-radius: 20px; 
            /* Efek bayangan dan bingkai agar terlihat mengambang hidup */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04); 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.25s ease-in-out; 
            border: 1px solid rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        
        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 12px 25px rgba(238, 77, 45, 0.18), 0 4px 10px rgba(0, 0, 0, 0.06);
            border-color: rgba(238, 77, 45, 0.3);
        }

        .card img { 
            width: 60px; 
            height: 60px; 
            object-fit: contain; 
            margin-bottom: 12px; 
            border-radius: 12px;
        }

        .card p { 
            font-size: 14px; 
            font-weight: 600; 
            color: #333; 
        }

        .status { 
            margin-top: 30px; 
            padding: 12px; 
            background: #e2f0d9; 
            color: #385723; 
            border-radius: 8px; 
            text-align: center; 
            font-weight: bold;

        }
